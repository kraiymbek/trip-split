<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip Split" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Trip Split</title>
  </head>
  <body>
    <!-- заставка до загрузки JS: React заменит содержимое #root -->
    <div id="root">
      <div class="boot" role="status" aria-label="Загрузка Trip Split">
        <img src="/icons/icon-192.png" alt="" width="72" height="72" />
        <div class="boot-name">Trip Split</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <style>
      body { margin: 0; background: #f8fafc; }
      .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; }
      .boot img { border-radius: 18px; box-shadow: 0 10px 30px -8px rgba(4, 120, 87, .45); animation: boot-in .5s ease-out both; }
      .boot-name { font-size: 22px; font-weight: 700; letter-spacing: -.02em; animation: boot-in .5s .08s ease-out both; }
      .boot-bar { width: 96px; height: 4px; border-radius: 4px; background: rgba(4, 120, 87, .15); overflow: hidden; margin-top: 6px; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #047857; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px) scale(.97); } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot-name { animation: none; } .boot-bar span { animation: none; width: 100%; opacity: .5; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
